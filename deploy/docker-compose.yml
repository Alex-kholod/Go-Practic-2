services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: auth
    environment:
      AUTH_PORT: ${AUTH_PORT}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT}
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    restart: unless-stopped

  redis-1:
    image: redis:7-alpine
    container_name: redis-1
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis1_data:/data

  redis-2:
    image: redis:7-alpine
    container_name: redis-2
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis2_data:/data

  redis-3:
    image: redis:7-alpine
    container_name: redis-3
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis3_data:/data

  redis-4:
    image: redis:7-alpine
    container_name: redis-4
    command: redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis4_data:/data

  redis-5:
    image: redis:7-alpine
    container_name: redis-5
    command: redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis5_data:/data

  redis-6:
    image: redis:7-alpine
    container_name: redis-6
    command: redis-server --port 7006 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis6_data:/data

  redis-init:
    image: redis:7-alpine
    container_name: redis-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    # Имена сервисов работают внутри docker-сети — никакого localhost.
    command: >
      sh -c "sleep 5 &&
      redis-cli --cluster create
      redis-1:7001 redis-2:7002 redis-3:7003
      redis-4:7004 redis-5:7005 redis-6:7006
      --cluster-replicas 1 --cluster-yes"
    restart: "no"

  tasks:
    build:
      context: ..
      dockerfile: services/tasks/Dockerfile
    container_name: tasks
    environment:
      TASKS_PORT: ${TASKS_PORT}
      AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR}
      DATABASE_URL: ${DATABASE_URL}
      # Адреса Redis по именам сервисов внутри docker-сети.
      REDIS_ADDRS: "redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006"
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      CACHE_TTL_JITTER_SECONDS: ${CACHE_TTL_JITTER_SECONDS}
    ports:
      - "${TASKS_PORT}:${TASKS_PORT}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      redis-1:
        condition: service_started
      redis-init:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_tls
    ports:
      - "8443:8443"
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./tls/key.pem:/etc/nginx/tls/key.pem:ro
    depends_on:
      - tasks
    restart: unless-stopped

volumes:
  pg_data:
  redis1_data:
  redis2_data:
  redis3_data:
  redis4_data:
  redis5_data:
  redis6_data: