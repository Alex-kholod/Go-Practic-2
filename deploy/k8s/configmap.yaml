apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-config
  namespace: default
  labels:
    app: tasks
data:
  # ── Сервис ──────────────────────────────────────────────────────────────────
  TASKS_PORT: "8082"
  INSTANCE_ID: "tasks-k8s"

  # ── Auth gRPC ────────────────────────────────────────────────────────────────
  # Если auth тоже задеплоен в кластер — используем DNS имя сервиса.
  # Формат: <service-name>.<namespace>.svc.cluster.local:<port>
  AUTH_GRPC_ADDR: "auth:50051"

  # ── База данных ──────────────────────────────────────────────────────────────
  # Несекретная часть DSN — хост и имя БД.
  # Пароль должен быть в Secret, не в ConfigMap.
  # Для учебного стенда допускается полный DSN здесь.
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/tasks?sslmode=disable"

  # ── Redis ────────────────────────────────────────────────────────────────────
  REDIS_ADDRS: "redis:6379"
  CACHE_TTL_SECONDS: "120"
  CACHE_TTL_JITTER_SECONDS: "30"

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  RABBIT_URL: "amqp://guest:guest@rabbitmq:5672/"
