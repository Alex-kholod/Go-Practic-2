name: CI

on:
  push:
    branches:
      - pz8

env:
  REGISTRY: ghcr.io

jobs:

  # тесты и сборка бинарников
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build auth
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./services/auth/cmd/auth

      - name: Build tasks
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./services/tasks/cmd/tasks

  # сборка и публикация Docker-образов
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag and owner
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          # Приводим owner к нижнему регистру — требование ghcr.io
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/auth/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/techip-auth:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/techip-auth:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push tasks
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/tasks/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/techip-tasks:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/techip-tasks:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max