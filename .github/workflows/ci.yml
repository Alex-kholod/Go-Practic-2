name: CI

on:
  push:
    branches:
      - pz8

env:
  REGISTRY: ghcr.io
  IMAGE_AUTH:  ghcr.io/${{ github.repository_owner }}/techip-auth
  IMAGE_TASKS: ghcr.io/${{ github.repository_owner }}/techip-tasks

jobs:
  # Тесты и сборка
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build auth
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./services/auth/cmd/auth

      - name: Build tasks
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./services/tasks/cmd/tasks

  # сборка и публикация Docker-образов
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write           # нужно для публикации в ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Короткий hash коммита используется как тег образа.
      # Это позволяет точно знать, из какого коммита собран образ.
      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/auth/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_AUTH }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_AUTH }}:latest
          # Кешируем слои между сборками через GitHub Actions cache.
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push tasks
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/tasks/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_TASKS }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_TASKS }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max